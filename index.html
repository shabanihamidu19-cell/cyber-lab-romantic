<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CYBER LAB — Romantic Generative Art</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03010a;color:#eee;font-family:'Segoe UI',Inter,system-ui,Arial,sans-serif}
body{position:relative}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;pointer-events:none;z-index:10}
header{padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:auto}
.brand{font-weight:800;letter-spacing:4px;font-size:clamp(15px,2.8vw,26px);background:linear-gradient(90deg,#e0aaff,#c77dff,#ff85c0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 20px rgba(199,125,255,.4)}
.status{font:600 10px monospace;letter-spacing:1.5px;color:#c9a0ff;display:flex;align-items:center;gap:6px}
.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9dffea;box-shadow:0 0 10px #9dffea;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
main{display:flex;align-items:center;justify-content:center;padding:8px 16px;position:relative}
.stage{width:min(94vw,920px);height:min(68vh,620px);position:relative;border:1px solid rgba(180,100,255,.35);background:rgba(4,0,18,.4);box-shadow:0 0 50px rgba(140,0,255,.15),inset 0 0 40px rgba(120,0,255,.06);backdrop-filter:blur(4px);overflow:hidden;border-radius:4px;transition:box-shadow .4s ease}
.stage:hover{box-shadow:0 0 60px rgba(180,50,255,.22),inset 0 0 50px rgba(140,0,255,.08)}
.stage:before,.stage:after{content:"";position:absolute;inset:8px;border:1px solid rgba(200,120,255,.12);pointer-events:none;border-radius:2px}
.stage:after{inset:0;border-color:rgba(255,255,255,.04)}
#art{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.corner{position:absolute;color:#d4b0ff;font:600 9px monospace;letter-spacing:1.5px;opacity:.75;pointer-events:none}
.c1{left:12px;top:10px}.c2{right:12px;top:10px}.c3{left:12px;bottom:10px}.c4{right:12px;bottom:10px}
.panel{position:absolute;left:14px;top:28px;padding:9px 11px;background:rgba(3,0,14,.78);border:1px solid rgba(180,90,255,.25);font:10px monospace;letter-spacing:1px;color:#c0a0d8;line-height:1.65;border-radius:3px;pointer-events:none;transition:opacity .3s}
.panel b{color:#fff}
.meter{width:120px;height:3px;background:#1a0f24;margin-top:4px;overflow:hidden;border-radius:2px}
.meter span{display:block;height:100%;width:76%;background:linear-gradient(90deg,#b100ff,#ff4d9e);box-shadow:0 0 8px #b100ff;transition:width .4s ease}
footer{padding:12px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:8px 10px;background:rgba(5,1,14,.82);border:1px solid rgba(170,80,255,.28);box-shadow:0 0 20px rgba(120,0,255,.1);border-radius:6px}
button{border:1px solid rgba(180,90,255,.35);background:#0b0514;color:#d4b0ff;padding:8px 12px;font:600 10px monospace;letter-spacing:1.2px;cursor:pointer;transition:all .25s ease;border-radius:4px}
button:hover,button.active{background:linear-gradient(135deg,#5a0080,#8b00b8);color:#fff;box-shadow:0 0 14px rgba(180,0,255,.45);border-color:rgba(220,140,255,.5)}
.personalize{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.personalize input{background:rgba(8,2,18,.9);border:1px solid rgba(180,90,255,.35);color:#e8d0ff;padding:8px 12px;font:600 11px monospace;letter-spacing:1px;border-radius:4px;outline:none;width:min(180px,40vw);transition:border-color .25s}
.personalize input:focus{border-color:#c77dff;box-shadow:0 0 10px rgba(180,100,255,.3)}
.personalize input::placeholder{color:#7a5a9a}
.sound-btn{min-width:42px}
.message-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .6s ease;z-index:5}
.message-overlay.show{opacity:1}
.message-box{background:rgba(10,0,25,.88);border:1px solid rgba(255,140,200,.4);padding:18px 28px;border-radius:8px;text-align:center;max-width:85%;box-shadow:0 0 40px rgba(255,100,180,.25);backdrop-filter:blur(8px)}
.message-box h2{margin:0 0 6px;font-size:clamp(16px,3.5vw,24px);font-weight:700;background:linear-gradient(90deg,#ff9ec7,#e0aaff,#a0e0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.message-box p{margin:0;font-size:clamp(11px,2vw,14px);color:#d0b0e8;letter-spacing:.5px;line-height:1.5}
.hint{font:500 9px monospace;color:#8a6aaa;letter-spacing:1px;opacity:.7;margin-top:2px}
@media(max-width:600px){
 header{padding:10px 12px}.stage{width:96vw;height:62vh}.panel{transform:scale(.82);transform-origin:top left}.controls{max-width:96vw}.controls button{padding:7px 9px;font-size:9px}
 .personalize input{width:min(140px,38vw);padding:7px 10px}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="ui">
<header>
  <div class="brand">CYBER LAB</div>
  <div class="status"><i></i>SYSTEM ONLINE</div>
</header>

<main>
  <section class="stage" id="stage">
    <canvas id="art"></canvas>
    <div class="corner c1">DATA_01 // LIVE</div>
    <div class="corner c2">CORE: <span id="sceneName">GENESIS</span></div>
    <div class="corner c3">RENDER // CANVAS</div>
    <div class="corner c4">FPS <span id="fps">60</span></div>
    <div class="panel">
      MODE: <b id="mode">GENERATIVE</b><br>
      ENERGY: <b id="energy">076%</b>
      <div class="meter"><span id="meter"></span></div>
    </div>
    <div class="message-overlay" id="msgOverlay">
      <div class="message-box">
        <h2 id="msgTitle">For You</h2>
        <p id="msgBody">A little light in the dark.</p>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="personalize">
    <input type="text" id="nameInput" placeholder="Enter a name..." maxlength="24" autocomplete="off">
    <button id="applyName" title="Personalize">APPLY</button>
    <button id="muteBtn" class="sound-btn" title="Toggle ambient sound">🔊</button>
  </div>
  <div class="controls">
    <button data-scene="gen" class="active">GENERATIVE</button>
    <button data-scene="dna">DNA</button>
    <button data-scene="rose">ROSE</button>
    <button data-scene="love">LOVE</button>
    <button data-scene="cosmic">COSMIC</button>
    <button data-scene="matrix">MATRIX</button>
    <button data-scene="auto">AUTO</button>
  </div>
  <div class="hint">Click the rose • Type a name for a personal message</div>
</footer>
</div>

<script>
const bg = document.getElementById('bg'), bc = bg.getContext('2d');
const art = document.getElementById('art'), ac = art.getContext('2d');
let W, H, dpr, AW, AH, adpr, time = 0, scene = 'gen', autoTimer = 0;
let last = performance.now(), frames = 0, fps = 60;
let userName = '', showMessage = false, messageTimer = 0;
let roseBloom = 0, roseClicked = false;
let muted = true, audioCtx = null, osc = null, gain = null;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  bg.width = W * dpr; bg.height = H * dpr;
  bc.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = art.getBoundingClientRect();
  AW = r.width; AH = r.height;
  adpr = Math.min(devicePixelRatio || 1, 2);
  art.width = AW * adpr; art.height = AH * adpr;
  ac.setTransform(adpr, 0, 0, adpr, 0, 0);
}
addEventListener('resize', resize);
resize();

/* ── Background nodes ── */
const nodes = [];
function initNodes() {
  nodes.length = 0;
  for (let i = 0; i < 48; i++) {
    nodes.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18,
      p: Math.random() * 6.28
    });
  }
}
initNodes();

function cyberBg() {
  bc.clearRect(0, 0, W, H);
  const g = bc.createRadialGradient(W * .5, H * .42, 0, W * .5, H * .42, Math.max(W, H) * .85);
  g.addColorStop(0, '#12001e');
  g.addColorStop(.45, '#06000c');
  g.addColorStop(1, '#010004');
  bc.fillStyle = g;
  bc.fillRect(0, 0, W, H);

  // soft grid
  bc.save();
  bc.globalAlpha = .18;
  bc.strokeStyle = '#6a00c8';
  bc.lineWidth = 1;
  const gap = 56;
  for (let x = (time * 7) % gap - gap; x < W; x += gap) {
    bc.beginPath(); bc.moveTo(x, 0); bc.lineTo(x, H); bc.stroke();
  }
  for (let y = (time * 4) % gap - gap; y < H; y += gap) {
    bc.beginPath(); bc.moveTo(0, y); bc.lineTo(W, y); bc.stroke();
  }
  bc.restore();

  // nodes
  nodes.forEach((n, i) => {
    n.x += n.vx; n.y += n.vy;
    if (n.x < 0 || n.x > W) n.vx *= -1;
    if (n.y < 0 || n.y > H) n.vy *= -1;
    for (let j = i + 1; j < nodes.length; j++) {
      const m = nodes[j], dx = n.x - m.x, dy = n.y - m.y, d = Math.hypot(dx, dy);
      if (d < 110) {
        bc.globalAlpha = (1 - d / 110) * .18;
        bc.strokeStyle = '#9a40ff';
        bc.beginPath(); bc.moveTo(n.x, n.y); bc.lineTo(m.x, m.y); bc.stroke();
      }
    }
    bc.globalAlpha = .4 + Math.sin(time * 1.6 + n.p) * .2;
    bc.fillStyle = '#b060ff';
    bc.shadowBlur = 10; bc.shadowColor = '#b060ff';
    bc.beginPath(); bc.arc(n.x, n.y, 1.4, 0, Math.PI * 2); bc.fill();
  });
  bc.shadowBlur = 0; bc.globalAlpha = 1;

  // soft scan line
  const sy = (time * 55) % H;
  bc.fillStyle = 'rgba(160,40,255,.025)';
  bc.fillRect(0, sy, W, 1.5);
}

function clearArt() {
  ac.clearRect(0, 0, AW, AH);
  const g = ac.createRadialGradient(AW / 2, AH / 2, 0, AW / 2, AH / 2, Math.max(AW, AH) * .7);
  g.addColorStop(0, 'rgba(28,0,48,.48)');
  g.addColorStop(1, 'rgba(0,0,0,.12)');
  ac.fillStyle = g;
  ac.fillRect(0, 0, AW, AH);
}

/* ── Generative ── */
function genArt() {
  const cx = AW / 2, cy = AH / 2, s = Math.min(AW, AH) / 460;
  ac.save();
  ac.translate(cx, cy);
  ac.lineWidth = 1.1;
  for (let k = 0; k < 72; k++) {
    const a = time * .15 + k * .07;
    const hue = (k * 21 + time * 28) % 360;
    ac.strokeStyle = `hsla(${hue},85%,62%,.62)`;
    ac.shadowBlur = 6; ac.shadowColor = ac.strokeStyle;
    ac.beginPath();
    for (let q = 0; q < Math.PI * 2 + .04; q += .04) {
      const r = (78 + 24 * Math.sin(5.5 * q + k * .16 + time * .42)) * s;
      const x = Math.cos(q + a) * r, y = Math.sin(q + a) * r;
      q === 0 ? ac.moveTo(x, y) : ac.lineTo(x, y);
    }
    ac.stroke();
  }
  ac.shadowBlur = 0;
  ac.restore();
}

/* ── DNA ── */
function dna() {
  const cx = AW / 2, cy = AH / 2, amp = Math.min(AW * .22, 115), height = AH * .76, steps = 90;
  for (let strand = 0; strand < 2; strand++) {
    ac.beginPath();
    for (let i = 0; i <= steps; i++) {
      const p = i / steps, y = cy - height / 2 + p * height;
      const ph = p * Math.PI * 5.5 + time * .75 + (strand ? Math.PI : 0);
      const x = cx + Math.sin(ph) * amp;
      i ? ac.lineTo(x, y) : ac.moveTo(x, y);
    }
    ac.strokeStyle = strand ? '#ff50c8' : '#30e8ff';
    ac.lineWidth = 2.6; ac.shadowBlur = 12; ac.shadowColor = ac.strokeStyle;
    ac.stroke();
  }
  for (let i = 0; i <= steps; i += 2) {
    const p = i / steps, y = cy - height / 2 + p * height;
    const ph = p * Math.PI * 5.5 + time * .75;
    const x1 = cx + Math.sin(ph) * amp, x2 = cx + Math.sin(ph + Math.PI) * amp;
    ac.strokeStyle = `hsla(${(i * 8 + time * 60) % 360},90%,60%,.55)`;
    ac.lineWidth = 1.3; ac.shadowBlur = 6;
    ac.beginPath(); ac.moveTo(x1, y); ac.lineTo(x2, y); ac.stroke();
  }
  ac.shadowBlur = 0;
}

/* ── Petal helper ── */
function petal(x, y, a, len, w, c, alpha) {
  ac.save();
  ac.translate(x, y);
  ac.rotate(a);
  ac.globalAlpha = alpha;
  ac.beginPath();
  ac.moveTo(0, 0);
  ac.bezierCurveTo(w, -len * .22, w, -len * .72, 0, -len);
  ac.bezierCurveTo(-w, -len * .72, -w, -len * .22, 0, 0);
  const g = ac.createLinearGradient(0, 0, 0, -len);
  g.addColorStop(0, '#3a0010');
  g.addColorStop(.4, c);
  g.addColorStop(1, '#ff90a8');
  ac.fillStyle = g;
  ac.shadowBlur = 10; ac.shadowColor = c;
  ac.fill();
  ac.restore();
}

/* ── Falling petals ── */
const fallingPetals = [];
function spawnPetal() {
  if (fallingPetals.length > 55) return;
  fallingPetals.push({
    x: Math.random() * AW,
    y: -20,
    vx: (Math.random() - .5) * 1.2,
    vy: .6 + Math.random() * 1.4,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - .5) * .04,
    size: 6 + Math.random() * 10,
    alpha: .5 + Math.random() * .4,
    hue: Math.random() > .5 ? '#e84080' : '#c02060'
  });
}
function updateFalling() {
  for (let i = fallingPetals.length - 1; i >= 0; i--) {
    const p = fallingPetals[i];
    p.x += p.vx + Math.sin(time * 1.5 + p.rot) * .3;
    p.y += p.vy;
    p.rot += p.vr;
    p.alpha -= .0015;
    if (p.y > AH + 30 || p.alpha <= 0) fallingPetals.splice(i, 1);
  }
}
function drawFalling() {
  fallingPetals.forEach(p => {
    ac.save();
    ac.translate(p.x, p.y);
    ac.rotate(p.rot);
    ac.globalAlpha = p.alpha;
    ac.fillStyle = p.hue;
    ac.shadowBlur = 6; ac.shadowColor = p.hue;
    ac.beginPath();
    ac.moveTo(0, 0);
    ac.bezierCurveTo(p.size * .4, -p.size * .3, p.size * .4, -p.size * .9, 0, -p.size);
    ac.bezierCurveTo(-p.size * .4, -p.size * .9, -p.size * .4, -p.size * .3, 0, 0);
    ac.fill();
    ac.restore();
  });
  ac.globalAlpha = 1; ac.shadowBlur = 0;
}

/* ── Butterflies & fireflies ── */
const butterflies = [];
const fireflies = [];
function initCreatures() {
  butterflies.length = 0;
  fireflies.length = 0;
  for (let i = 0; i < 6; i++) {
    butterflies.push({
      x: Math.random() * AW, y: Math.random() * AH * .6,
      phase: Math.random() * Math.PI * 2,
      speed: .4 + Math.random() * .5,
      size: 5 + Math.random() * 4,
      hue: Math.random() > .5 ? '#ff90c0' : '#c0a0ff'
    });
  }
  for (let i = 0; i < 28; i++) {
    fireflies.push({
      x: Math.random() * AW, y: Math.random() * AH,
      phase: Math.random() * Math.PI * 2,
      speed: .15 + Math.random() * .25,
      r: 1.2 + Math.random() * 1.8
    });
  }
}
initCreatures();

function drawButterflies() {
  butterflies.forEach(b => {
    b.phase += b.speed * .02;
    b.x += Math.sin(b.phase * .7) * .8;
    b.y += Math.cos(b.phase * .5) * .5;
    if (b.x < -20) b.x = AW + 20;
    if (b.x > AW + 20) b.x = -20;
    if (b.y < -20) b.y = AH * .7;
    if (b.y > AH * .75) b.y = 10;

    const flap = Math.sin(time * 8 + b.phase) * .6;
    ac.save();
    ac.translate(b.x, b.y);
    ac.globalAlpha = .75;
    // left wing
    ac.fillStyle = b.hue;
    ac.shadowBlur = 8; ac.shadowColor = b.hue;
    ac.beginPath();
    ac.ellipse(-b.size * .6, 0, b.size * (.7 + flap * .3), b.size * .9, -0.4, 0, Math.PI * 2);
    ac.fill();
    // right wing
    ac.beginPath();
    ac.ellipse(b.size * .6, 0, b.size * (.7 + flap * .3), b.size * .9, 0.4, 0, Math.PI * 2);
    ac.fill();
    // body
    ac.fillStyle = '#2a1030';
    ac.beginPath();
    ac.ellipse(0, 0, b.size * .18, b.size * .7, 0, 0, Math.PI * 2);
    ac.fill();
    ac.restore();
  });
  ac.globalAlpha = 1; ac.shadowBlur = 0;
}

function drawFireflies() {
  fireflies.forEach(f => {
    f.phase += f.speed * .03;
    f.x += Math.sin(f.phase) * .4;
    f.y += Math.cos(f.phase * .8) * .3;
    if (f.x < 0) f.x = AW;
    if (f.x > AW) f.x = 0;
    if (f.y < 0) f.y = AH;
    if (f.y > AH) f.y = 0;

    const glow = .35 + Math.sin(time * 3 + f.phase) * .35;
    ac.globalAlpha = glow;
    ac.fillStyle = '#ffe8a0';
    ac.shadowBlur = 12; ac.shadowColor = '#ffd060';
    ac.beginPath();
    ac.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ac.fill();
  });
  ac.globalAlpha = 1; ac.shadowBlur = 0;
}

/* ── Rose scene ── */
function rose(isLove = false) {
  const cx = AW / 2, cy = AH * .4, s = Math.min(AW, AH) / 460;
  const bloom = Math.min(1, roseBloom);

  // stem
  ac.save();
  ac.beginPath();
  ac.moveTo(cx, cy + 12 * s);
  ac.bezierCurveTo(cx - 6 * s, cy + 80 * s, cx + 18 * s, cy + 170 * s, cx - 2 * s, cy + 280 * s);
  ac.strokeStyle = isLove ? '#2ecc71' : '#1d9a45';
  ac.lineWidth = 6 * s; ac.lineCap = 'round';
  ac.shadowBlur = 6; ac.shadowColor = '#00c060';
  ac.stroke();
  ac.restore();

  // layers of petals (blooming)
  const layers = 8;
  for (let l = layers; l >= 1; l--) {
    const count = 8 + l * 3;
    const r = l * 9 * s * bloom;
    for (let i = 0; i < count; i++) {
      const a = i / count * Math.PI * 2 + l * .4 + Math.sin(time * .6) * .02;
      const len = (40 + l * 6) * s * (.85 + .15 * Math.sin(time * .9 + i)) * bloom;
      const w = (15 + l * 2.2) * s * bloom;
      const col = isLove
        ? (l % 2 ? '#e83070' : '#c01050')
        : (l % 2 ? '#e51d4f' : '#9d0031');
      petal(cx + Math.cos(a) * r, cy + Math.sin(a) * r * .65, a + Math.PI / 2, len, w, col, .82 * bloom);
    }
  }

  // inner petals
  for (let i = 0; i < 22; i++) {
    const a = i * .75 + time * .25;
    const r = i * 1.5 * s * bloom;
    petal(cx + Math.cos(a) * r, cy + Math.sin(a) * r * .55, a + Math.PI / 2, 34 * s * bloom, 12 * s * bloom, isLove ? '#ff3060' : '#ff1744', .9 * bloom);
  }

  // center
  if (bloom > .3) {
    ac.fillStyle = isLove ? '#ffb0c0' : '#ffb2bf';
    ac.shadowBlur = 16; ac.shadowColor = isLove ? '#ff4080' : '#ff1744';
    ac.beginPath();
    ac.arc(cx, cy, 8 * s * bloom, 0, Math.PI * 2);
    ac.fill();
  }

  // heartbeat glow for love mode
  if (isLove) {
    const beat = .5 + .5 * Math.sin(time * 3.2);
    ac.globalAlpha = .12 + beat * .18;
    ac.fillStyle = '#ff5090';
    ac.shadowBlur = 40; ac.shadowColor = '#ff4080';
    ac.beginPath();
    ac.arc(cx, cy, 55 * s * bloom * (1 + beat * .15), 0, Math.PI * 2);
    ac.fill();
    ac.globalAlpha = 1; ac.shadowBlur = 0;
  }

  // falling petals
  if (Math.random() < .08 * bloom) spawnPetal();
  updateFalling();
  drawFalling();

  // creatures
  drawButterflies();
  drawFireflies();

  // progress bloom
  if (roseBloom < 1) roseBloom += .008;
}

/* ── Cosmic scene ── */
const stars = Array.from({ length: 120 }, () => ({
  x: Math.random(), y: Math.random(),
  r: .4 + Math.random() * 1.6,
  tw: Math.random() * Math.PI * 2,
  sp: .5 + Math.random() * 1.5
}));
function cosmic() {
  const cx = AW / 2, cy = AH / 2;

  // soft nebula
  for (let i = 0; i < 4; i++) {
    const nx = cx + Math.sin(time * .12 + i * 1.7) * AW * .2;
    const ny = cy + Math.cos(time * .1 + i * 2.1) * AH * .15;
    const g = ac.createRadialGradient(nx, ny, 0, nx, ny, 140 + i * 30);
    g.addColorStop(0, `hsla(${280 + i * 25},70%,50%,.12)`);
    g.addColorStop(1, 'transparent');
    ac.fillStyle = g;
    ac.beginPath();
    ac.arc(nx, ny, 180, 0, Math.PI * 2);
    ac.fill();
  }

  // stars
  stars.forEach(s => {
    const tw = .3 + .7 * Math.sin(time * s.sp + s.tw);
    ac.globalAlpha = tw * .85;
    ac.fillStyle = '#e8d0ff';
    ac.shadowBlur = 4; ac.shadowColor = '#c0a0ff';
    ac.beginPath();
    ac.arc(s.x * AW, s.y * AH, s.r * tw, 0, Math.PI * 2);
    ac.fill();
  });
  ac.globalAlpha = 1; ac.shadowBlur = 0;

  // moon
  const mx = AW * .78, my = AH * .22;
  const mg = ac.createRadialGradient(mx - 8, my - 6, 0, mx, my, 38);
  mg.addColorStop(0, '#fff8f0');
  mg.addColorStop(.7, '#e8d8c0');
  mg.addColorStop(1, '#c0a890');
  ac.fillStyle = mg;
  ac.shadowBlur = 25; ac.shadowColor = 'rgba(255,240,220,.4)';
  ac.beginPath();
  ac.arc(mx, my, 32, 0, Math.PI * 2);
  ac.fill();
  ac.shadowBlur = 0;

  // aurora bands
  for (let b = 0; b < 3; b++) {
    ac.beginPath();
    ac.moveTo(0, AH * (.55 + b * .08));
    for (let x = 0; x <= AW; x += 8) {
      const y = AH * (.55 + b * .08) + Math.sin(x * .012 + time * .4 + b) * 28 + Math.sin(x * .03 + time * .6) * 12;
      ac.lineTo(x, y);
    }
    ac.strokeStyle = `hsla(${160 + b * 40},70%,60%,${.12 - b * .03})`;
    ac.lineWidth = 18 - b * 4;
    ac.shadowBlur = 20; ac.shadowColor = `hsla(${160 + b * 40},80%,50%,.3)`;
    ac.stroke();
  }
  ac.shadowBlur = 0;

  // soft galaxy spiral
  ac.save();
  ac.translate(cx, cy + 20);
  ac.globalAlpha = .35;
  for (let i = 0; i < 180; i++) {
    const a = i * .12 + time * .15;
    const r = i * 1.1;
    const x = Math.cos(a) * r, y = Math.sin(a) * r * .55;
    ac.fillStyle = `hsla(${260 + i * .4},70%,65%,.5)`;
    ac.beginPath();
    ac.arc(x, y, 1.2, 0, Math.PI * 2);
    ac.fill();
  }
  ac.restore();
  ac.globalAlpha = 1;
}

/* ── Matrix ── */
const drops = Array.from({ length: 100 }, () => ({
  x: Math.random() * 900, y: Math.random() * 600,
  s: 7 + Math.random() * 14, v: 20 + Math.random() * 50
}));
function matrix() {
  ac.font = '11px monospace';
  drops.forEach((d, i) => {
    d.y += d.v * .014;
    if (d.y > AH + 20) { d.y = -20; d.x = Math.random() * AW; }
    const chars = '01ABCDEF<>/[]{}$#♡✦';
    ac.fillStyle = i % 8 === 0 ? '#e070ff' : '#8040d0';
    ac.globalAlpha = .2 + (i % 5) * .1;
    ac.fillText(chars[Math.floor((time * d.v + i * 3) % chars.length)], d.x % AW, d.y);
  });
  ac.globalAlpha = 1;
}

/* ── Message system ── */
function showPersonalMessage() {
  const title = document.getElementById('msgTitle');
  const body = document.getElementById('msgBody');
  const overlay = document.getElementById('msgOverlay');
  if (userName) {
    title.textContent = `For ${userName}`;
    const msgs = [
      `The stars aligned just for you, ${userName}.`,
      `A soft light in the dark — made for ${userName}.`,
      `${userName}, you make the night glow a little brighter.`,
      `Somewhere between code and cosmos… this is for ${userName}.`,
      `Blooming quietly, just like thoughts of ${userName}.`
    ];
    body.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  } else {
    title.textContent = 'For You';
    body.textContent = 'A quiet moment among the stars.';
  }
  overlay.classList.add('show');
  showMessage = true;
  messageTimer = 0;
}

/* ── Audio (subtle ambient) ── */
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    gain = audioCtx.createGain();
    gain.gain.value = 0;
    gain.connect(audioCtx.destination);

    // soft drone
    osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = 110;
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = 164.8;
    const g1 = audioCtx.createGain();
    g1.gain.value = .04;
    const g2 = audioCtx.createGain();
    g2.gain.value = .025;
    osc.connect(g1); g1.connect(gain);
    osc2.connect(g2); g2.connect(gain);
    osc.start(); osc2.start();
  } catch (e) {}
}

function toggleMute() {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if (!muted) {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (gain) gain.gain.linearRampToValueAtTime(.35, audioCtx.currentTime + .8);
  } else {
    if (gain) gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + .5);
  }
}

/* ── Main render ── */
function render() {
  cyberBg();
  clearArt();

  if (scene === 'gen') genArt();
  else if (scene === 'dna') dna();
  else if (scene === 'rose') rose(false);
  else if (scene === 'love') rose(true);
  else if (scene === 'cosmic') cosmic();
  else if (scene === 'matrix') matrix();
  else if (scene === 'auto') {
    const modes = ['gen', 'dna', 'rose', 'love', 'cosmic', 'matrix'];
    const m = modes[Math.floor(autoTimer / 8) % modes.length];
    if (m === 'gen') genArt();
    else if (m === 'dna') dna();
    else if (m === 'rose') rose(false);
    else if (m === 'love') rose(true);
    else if (m === 'cosmic') cosmic();
    else if (m === 'matrix') matrix();
  }

  // energy meter animation
  const energy = 60 + Math.sin(time * .8) * 18 + Math.sin(time * 2.1) * 8;
  document.getElementById('energy').textContent = String(Math.round(energy)).padStart(3, '0') + '%';
  document.getElementById('meter').style.width = energy + '%';

  // message timeout
  if (showMessage) {
    messageTimer += .016;
    if (messageTimer > 5.5) {
      document.getElementById('msgOverlay').classList.remove('show');
      showMessage = false;
    }
  }

  time += .016;
  autoTimer += .016;
  frames++;
  const now = performance.now();
  if (now - last > 700) {
    fps = Math.round(frames * 1000 / (now - last));
    frames = 0; last = now;
    document.getElementById('fps').textContent = fps;
  }
  requestAnimationFrame(render);
}
render();

/* ── Scene switching ── */
function setScene(s) {
  scene = s;
  autoTimer = 0;
  roseBloom = 0;
  roseClicked = false;
  fallingPetals.length = 0;
  document.querySelectorAll('.controls button').forEach(b => b.classList.toggle('active', b.dataset.scene === s));
  const names = {
    gen: 'GENERATIVE', dna: 'DNA', rose: 'ROSE', love: 'LOVE',
    cosmic: 'COSMIC', matrix: 'MATRIX', auto: 'AUTO'
  };
  document.getElementById('mode').textContent = names[s];
  document.getElementById('sceneName').textContent = names[s];
  if (s === 'rose' || s === 'love') initCreatures();
}
document.querySelectorAll('.controls button').forEach(b => {
  b.addEventListener('click', () => setScene(b.dataset.scene));
});

/* ── Click interaction on canvas ── */
art.addEventListener('click', (e) => {
  if (scene === 'rose' || scene === 'love') {
    roseClicked = true;
    roseBloom = Math.min(1, roseBloom + .25);
    for (let i = 0; i < 12; i++) spawnPetal();
    showPersonalMessage();
  } else if (scene === 'cosmic') {
    showPersonalMessage();
  }
});

/* ── Name personalization ── */
document.getElementById('applyName').addEventListener('click', () => {
  userName = document.getElementById('nameInput').value.trim();
  if (userName) showPersonalMessage();
});
document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    userName = e.target.value.trim();
    if (userName) showPersonalMessage();
  }
});

document.getElementById('muteBtn').addEventListener('click', toggleMute);
</script>
